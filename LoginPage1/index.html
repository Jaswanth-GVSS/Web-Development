                        </div>

                              in
                        </div>
                    </div>
                    <div class="OR">
                       <h5>----------------OR-----------------</h5>
                    </div>

                        <input type="password" placeholder="Password">
                        
                    </div>

                </div>
                <div class="card-footer">
    <button id="sign-in">Sign In</button>
</div>

            </div>
        </div>
